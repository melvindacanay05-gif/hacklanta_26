<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone Mic</title>
<style>
  body { font-family: sans-serif; text-align: center; margin: 2em; }
  button, input { font-size: 1.5em; padding: .5em 1em; margin: .3em; }
  #code { font-size: 4em; letter-spacing: .15em; font-weight: bold; }
  ul { list-style: none; padding: 0; font-size: 1.2em; }
</style>
</head>
<body>
<h1>Phone Mic</h1>

<div id="choose">
  <button onclick="startLaptop()">I'm the laptop (receive)</button>
  <button onclick="showPhone()">I'm the phone (send mic)</button>
</div>

<div id="qr"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  new QRCode(document.getElementById("qr"), location.href);
</script>

<div id="laptop" hidden>
  <p>Enter this code on your phone:</p>
  <div id="code">....</div>
  <p id="lstatus">Waiting for phone...</p>
  <ul id="devices"></ul>
  <audio id="audio" autoplay controls></audio>
</div>

<div id="phone" hidden>
  <input id="nameInput" placeholder="Device name (e.g. Guitar)" maxlength="10"><br>
  <input id="codeInput" inputmode="numeric" maxlength="4" placeholder="1234">
  <button onclick="startPhone()">Connect &amp; share mic</button>
  <p id="pstatus"></p>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const PREFIX = "phonemic-";
const keepAlive = [];   // keeps extra audio elements alive

function startLaptop() {
  $("choose").hidden = true;
  $("laptop").hidden = false;
  const code = String(Math.floor(1000 + Math.random() * 9000));
  $("code").textContent = code;
  const peer = new Peer(PREFIX + code);
  peer.on("call", call => {
    call.answer();                       // we only receive, no mic needed here
    const name = (call.metadata && call.metadata.name) || "Phone";
    const li = document.createElement("li");
    li.textContent = name + ": connecting...";
    $("devices").appendChild(li);
    call.on("stream", stream => {
      // play through the laptop output (first phone uses the page's player,
      // extra phones get their own player so they don't replace each other)
      const el = $("audio").srcObject ? new Audio() : $("audio");
      el.srcObject = stream;
      el.play();
      keepAlive.push(el);
      $("lstatus").textContent = "Connected! Receiving phone mic.";
      forwardToPython(stream, name, li);   // send to app.py for pitch detection
    });
    call.on("close", () => {
      li.textContent = name + ": disconnected";
      $("lstatus").textContent = "Phone disconnected.";
    });
  });
  peer.on("error", e => $("lstatus").textContent = "Error: " + e.type);
}

// Sends the phone's audio to app.py (same pipeline as the laptop mic)
function forwardToPython(stream, name, li) {
  const ws = new WebSocket("ws://localhost:8765/ws?name=" + encodeURIComponent(name));
  ws.binaryType = "arraybuffer";
  ws.onerror = () => li.textContent = name + ": can't reach app.py. Is it running?";
  ws.onopen = () => {
    const ctx = new AudioContext({ sampleRate: 22050 });   // matches SAMPLE_RATE in app.py
    ctx.resume();
    const src = ctx.createMediaStreamSource(stream);
    const proc = ctx.createScriptProcessor(4096, 1, 1);
    proc.onaudioprocess = e => {
      if (ws.readyState === 1)
        ws.send(new Float32Array(e.inputBuffer.getChannelData(0)).buffer);
    };
    src.connect(proc);
    proc.connect(ctx.destination);   // outputs silence; just keeps the node running
    li.textContent = name + ": connected, sending to app.py";
  };
}

function showPhone() {
  $("choose").hidden = true;
  $("phone").hidden = false;
}

async function startPhone() {
  const code = $("codeInput").value.trim();
  const name = $("nameInput").value.trim() || "Phone";
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
    const peer = new Peer();
    peer.on("open", () => {
      const call = peer.call(PREFIX + code, stream, { metadata: { name } });
      $("pstatus").textContent = "Streaming your mic to the laptop as \"" + name + "\"...";
      call.on("close", () => $("pstatus").textContent = "Disconnected.");
    });
    peer.on("error", e => $("pstatus").textContent = "Error: " + e.type);
  } catch (e) {
    $("pstatus").textContent = "Mic error: " + e.message;
  }
}
</script>
</body>
</html>
