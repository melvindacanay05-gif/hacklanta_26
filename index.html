<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PitchBattle Lite</title>
<style>
:root{--bg:#fff;--fg:#111;--mut:#666;--box:#f2f2f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--fg:#eee;--mut:#999;--box:#222}}
:root[data-theme="dark"]{--bg:#111;--fg:#eee;--mut:#999;--box:#222}
body{background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;max-width:680px;margin:0 auto;padding:16px;text-align:center}
button{font-size:1rem;padding:10px 22px;border-radius:8px;border:1px solid var(--mut);background:var(--box);color:var(--fg);cursor:pointer}
canvas{width:100%;max-width:640px;background:var(--box);border-radius:8px}
label{margin:0 8px;white-space:nowrap}
.hide{display:none}.big{font-size:1.4rem;font-weight:700;min-height:1.8em}
input[type=text]{font-size:1rem;padding:10px 22px;border-radius:8px;border:1px solid var(--mut);background:var(--box);color:var(--fg)}
#phonebox{background:var(--box);border-radius:8px;padding:12px;margin:12px 0}
#qr{display:flex;justify-content:center;margin:8px 0}
#pstat{font-weight:700}.ok{color:#4caf50}.bad{color:#e53935}
</style></head><body>

<nav>
  <a href="../index.html">Phone Mic</a>
  <a href="mode_one\pitch_battle.html" class="active">Pitch Battle</a>
</nav>
<style>
  nav { margin-bottom: 1em; font-size: 1.2em; text-align: center; }
  nav a { margin: 0 .6em; text-decoration: none; }
  nav a.active { font-weight: bold; text-decoration: underline; }
</style>

<h1>PitchBattle Lite</h1>
<!-- PHONE SIDE: shown only when opened via the QR link (?phone=CODE) -->
<div id="phoneui" class="hide">
  <h2>Phone mic</h2>
  <p><input type="text" id="pname" placeholder="Device name" maxlength="10"></p>
  <button id="psend">Share my mic</button>
  <p id="pphonestat"></p>
</div>
<div id="start">
  <p>Sing "You Are My Sunshine". In 2-player mode, P2 chases P1's ghost line.</p>
  <p><b>Input:</b>
     <label><input type="radio" name="src" value="laptop" checked> Laptop mic (square)</label>
     <label><input type="radio" name="src" value="phone"> Phone mic (circle)</label></p>
  <div id="phonebox" class="hide">
    <div class="big" id="pcode"></div>
    <div id="qr"></div>
    <p id="purl" style="color:var(--mut);font-size:.8rem;word-break:break-all"></p>
    <p id="pstat" class="bad">Starting...</p>
  </div>
  <p><label><input type="checkbox" id="solo"> Solo</label>
     <label><input type="checkbox" id="auto"> Auto-sing</label>
     <label><input type="checkbox" id="back" checked> Backing (headphones!)</label></p>
  <p style="color:var(--mut)">No mic? Hold A W S E D F T G Y H U J K (C4–C5).</p>
  <button id="go" disabled>Loading song...</button>
  <p id="loadmsg" style="color:var(--mut)"></p>
</div>
<div id="game" class="hide">
  <h2 id="who"></h2>
  <canvas id="cv" width="640" height="260"></canvas>
  <div class="big" id="lyric"></div>
  <p id="hud"></p>
</div>
<div id="mid" class="hide"><h2 id="midtxt"></h2><button id="go2">Player 2: Start</button></div>
<div id="end" class="hide"><h2 id="endtxt"></h2><button onclick="location.reload()">Play again</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $=id=>document.getElementById(id);
// Song data lives in song.json (or ?song=other.json)
let N=[],BASS=[],DUR=35,COUNT=3,LO=55,HI=74;
const NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const target=t=>N.find(n=>t>=n.s&&t<=n.e);

// Load song JSON, then enable Start
const songFile=new URLSearchParams(location.search).get('song')||'song.json';
fetch(songFile).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(s=>{
  N=s.notes.map(k=>({m:k.midi,s:k.start,e:k.end,l:k.lyric}));
  BASS=s.bass.map(b=>[b.time,b.midi]);
  DUR=s.duration;COUNT=s.countIn;
  const ms=N.map(k=>k.m);LO=Math.min(...ms)-5;HI=Math.max(...ms)+5;
  $('go').textContent='Start Player 1';$('go').disabled=false;
  $('loadmsg').textContent=s.title||'';
}).catch(e=>{$('loadmsg').textContent='Could not load '+songFile+' ('+e.message+'). Serve over http(s); fetch does not work from file://'});
const hz=m=>440*Math.pow(2,(m-69)/12);

// YIN pitch detector
function yin(buf,sr){
  let r=0;for(const x of buf)r+=x*x;
  if(Math.sqrt(r/buf.length)<.005)return -1;
  const n=buf.length>>1,d=new Float32Array(n),maxT=Math.min(n-1,sr/80|0),minT=sr/1000|0;
  for(let t=1;t<=maxT;t++){let s=0;for(let i=0;i<n;i+=2){const v=buf[i]-buf[i+t];s+=v*v}d[t]=s}
  let run=0;d[0]=1;
  for(let t=1;t<=maxT;t++){run+=d[t];d[t]=d[t]*t/run}
  for(let t=Math.max(2,minT);t<maxT;t++){
    if(d[t]<.15){
      while(t+1<maxT&&d[t+1]<d[t])t++;
      const a=d[t-1],b=d[t],c=d[t+1],den=a-2*b+c;
      return sr/(t+(den?(a-c)/(2*den):0));
    }
  }
  return -1;
}

// Audio
const PREFIX='phonemic-';
let micMsg='',ac,micAn=null,phoneAn=null,phoneName='',mode='laptop',peer=null,keyMidi=null,player=0,t0=0,running=false,nodes=[];
const keepAlive=[];
const keys={a:60,w:61,s:62,e:63,d:64,f:65,t:66,g:67,y:68,h:69,u:70,j:71,k:72};
addEventListener('keydown',e=>{if(!e.repeat&&keys[e.key])keyMidi=keys[e.key]});
addEventListener('keyup',e=>{if(keys[e.key])keyMidi=null});
const getAC=()=>ac=ac||new (window.AudioContext||window.webkitAudioContext)();
function mkAn(stream){ // analyser fed by a MediaStream, silent sink so no feedback
  const c=getAC(),a=c.createAnalyser();
  a.fftSize=2048;a.smoothingTimeConstant=0;a.b=new Float32Array(a.fftSize);
  const z=c.createGain();z.gain.value=0;
  c.createMediaStreamSource(stream).connect(a);a.connect(z);z.connect(c.destination);
  return a;
}
async function init(){
  getAC();await ac.resume();
  if(mode==='laptop'&&!micAn){
    try{
      const s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:false}});
      micAn=mkAn(s);micMsg='';
    }catch(e){micMsg='Mic blocked ('+e.name+'): use https/localhost, or use keys'}
  }
}
const inputLabel=()=>keyMidi!=null?'Keyboard':$('auto').checked?'Auto-sing':
  mode==='phone'?(phoneAn?'Phone ('+phoneName+')':'Phone - NOT connected'):'Laptop mic';

// Phone mic: laptop (host) side
function hostPhone(){
  if(peer)return;
  const code=String(1000+Math.floor(Math.random()*9000));
  const url=location.href.split(/[?#]/)[0]+'?phone='+code;
  $('pcode').textContent='Code: '+code;$('purl').textContent=url;
  new QRCode($('qr'),{text:url,width:160,height:160});
  if(!(location.protocol==='https:'||location.hostname==='localhost')){
    $('pstat').textContent='Not on https: the phone cannot use its mic.';$('pstat').className='bad';
  }
  peer=new Peer(PREFIX+code);
  peer.on('open',()=>{if(!phoneAn){$('pstat').textContent='Waiting for phone...';$('pstat').className='bad'}});
  peer.on('call',call=>{
    call.answer();let got=false;
    call.on('stream',st=>{
      if(got)return;got=true;
      phoneName=(call.metadata&&call.metadata.name)||'Phone';
      const el=new Audio();el.srcObject=st;el.muted=true;el.play().catch(()=>{});keepAlive.push(el); // Chrome needs an element attached
      phoneAn=mkAn(st);
      $('pstat').textContent='Phone connected: '+phoneName;$('pstat').className='ok';
    });
    call.on('close',()=>{phoneAn=null;$('pstat').textContent='Phone disconnected';$('pstat').className='bad'});
  });
  peer.on('error',e=>{$('pstat').textContent='Error: '+e.type;$('pstat').className='bad'});
}
document.querySelectorAll('input[name=src]').forEach(r=>r.onchange=()=>{
  mode=r.value;$('phonebox').classList.toggle('hide',mode!=='phone');
  if(mode==='phone')hostPhone();
});

// Phone mic: phone (sender) side
const joinCode=new URLSearchParams(location.search).get('phone');
if(joinCode){
  $('start').classList.add('hide');$('phoneui').classList.remove('hide');
  $('psend').onclick=async()=>{
    const st=$('pphonestat'),name=$('pname').value.trim()||'Phone';
    try{
      const ms=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
      try{navigator.wakeLock&&navigator.wakeLock.request('screen')}catch(e){}
      const p=new Peer();
      p.on('open',()=>{
        const call=p.call(PREFIX+joinCode,ms,{metadata:{name}});
        st.textContent='Streaming mic as "'+name+'". Keep this screen on.';
        call.on('close',()=>st.textContent='Disconnected.');
      });
      p.on('error',e=>st.textContent=e.type==='peer-unavailable'?'Laptop not found. Reload the laptop page and rescan.':'Error: '+e.type);
    }catch(e){st.textContent='Mic error: '+e.message+(isSecureContext?'':' (page must be https)')}
  };
}
function tone(type,f,start,dur,vol){
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(.0001,start);g.gain.linearRampToValueAtTime(vol,start+.03);
  g.gain.exponentialRampToValueAtTime(.0001,start+dur);
  o.connect(g).connect(ac.destination);o.start(start);o.stop(start+dur+.05);nodes.push(o);
}
function schedule(base){
  [0,.75,1.5,2.25].forEach((o,i)=>tone('triangle',i==3?880:587,base+o,.12,.3)); // count-in
  if(!$('back').checked)return;
  N.forEach(n=>tone('sine',hz(n.m),base+n.s,n.e-n.s,.15)); // guide melody
  BASS.forEach(([t,m],i)=>tone('triangle',hz(m),base+t,(BASS[i+1]?BASS[i+1][0]:DUR)-t,.2)); // bass
}

// Game state
const blank=()=>({score:0,combo:0,max:0,n:0,hit:0,hist:[]});
const P=[blank(),blank()];
async function startRound(p){
  await init();player=p;
  ['start','mid','end'].forEach(i=>$(i).classList.add('hide'));
  $('game').classList.remove('hide');
  $('who').textContent=$('solo').checked?'Solo':'Player '+(p+1);
  t0=ac.currentTime;schedule(t0);running=true;requestAnimationFrame(frame);
}
$('go').onclick=()=>startRound(0);
$('go2').onclick=()=>startRound(1);

// Canvas
let curY=130;const cv=$('cv'),g=cv.getContext('2d'),W=640,H=260,PPS=140,NOWX=150;
const Y=m=>H-(Math.max(LO-1,Math.min(HI+1,m))-LO)/(HI-LO)*H;

function frame(){
  if(!running)return;
  const t=ac.currentTime-t0,n=target(t),s=P[player];
  let m=null;
  if(keyMidi!=null)m=keyMidi;
  else if($('auto').checked){if(n)m=n.m+Math.sin(t*31.4)*.15}
  else{
    const an=mode==='phone'?phoneAn:micAn;
    if(an){an.getFloatTimeDomainData(an.b);const f=yin(an.b,ac.sampleRate);if(f>0)m=69+12*Math.log2(f/440)}
  }
  // octave-folded display & scoring
  let disp=null,dist=99;
  if(m!=null){
    disp=m+12*Math.round(((n?n.m:65)-m)/12);
    if(n){dist=Math.abs(((m-n.m)%12+12)%12);dist=Math.min(dist,12-dist)}
  }
  if(n){
    s.n++;
    if(dist<=.75){
      s.hit++;s.combo++;s.max=Math.max(s.max,s.combo);
      const mult=s.combo>=30?3:s.combo>=15?2:s.combo>=5?1.5:1;
      s.score+=Math.round((dist<=.35?100:50)*mult);
    }else s.combo=0;
  }
  if(disp!=null)s.hist.push([t,disp]);

  g.clearRect(0,0,W,H);
  const X=tt=>NOWX+(tt-t)*PPS;
  g.fillStyle='#e91e63';
  N.forEach(k=>g.fillRect(X(k.s),Y(k.m)-8,(k.e-k.s)*PPS,16));
  if(player===1&&!$('solo').checked){g.fillStyle='rgba(0,200,255,.6)';P[0].hist.forEach(([tt,mm])=>g.fillRect(X(tt),Y(mm)-2,3,4))}
  if(disp!=null){ // cursor follows your pitch at the hit line
    curY+=(Y(disp)-curY)*.4;
    g.fillStyle=dist<=.75?'#4caf50':'#fff';g.strokeStyle='#000';g.lineWidth=2;
    g.beginPath();
    if(mode==='phone')g.arc(NOWX,curY,11,0,7);else g.rect(NOWX-11,curY-11,22,22);
    g.fill();g.stroke();
  }
  g.fillStyle='#888';g.fillRect(NOWX,0,2,H);

  $('lyric').textContent=t<COUNT?'Get ready... '+Math.ceil(COUNT-t):(n?n.l:'');
  $('hud').textContent='Input: '+inputLabel()+' | Score '+s.score+' | Combo '+s.combo+' | You: '+(m!=null?NAMES[Math.round(m)%12]:'--')+' | Target: '+(n?NAMES[n.m%12]:'--')+(micMsg?' | '+micMsg:'');
  if(t>=DUR){running=false;nodes.forEach(o=>{try{o.stop()}catch(e){}});nodes=[];finish();return}
  requestAnimationFrame(frame);
}
const acc=i=>P[i].n?Math.round(100*P[i].hit/P[i].n):0;
const line=(l,i)=>l+': '+P[i].score+' pts, '+acc(i)+'% acc, max combo '+P[i].max;
function finish(){
  $('game').classList.add('hide');
  const solo=$('solo').checked;
  if(player===0&&!solo){
    $('midtxt').innerHTML=line('P1',0)+'<br>Pass the mic!';
    $('mid').classList.remove('hide');
  }else{
    const w=solo?'Song complete!':P[0].score===P[1].score?'Tie!':P[0].score>P[1].score?'Player 1 wins!':'Player 2 wins!';
    $('endtxt').innerHTML=w+'<br>'+line('P1',0)+(solo?'':'<br>'+line('P2',1));
    $('end').classList.remove('hide');
  }
}
</script></body></html>
