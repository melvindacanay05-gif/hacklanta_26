<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SingZone - Host Party Screen</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="host-body">
    <header class="app-header">
        <div class="logo">🎤 SingZone Host Screen</div>
        <div class="host-controls">
            <select id="song-select" style="max-width: 260px;">
                <option value="demo_song">Twinkle Twinkle Little Star (Demo)</option>
            </select>
            <button id="start-song-btn" class="btn btn-primary" style="padding: 10px 24px;">▶ Play Song</button>
            <button id="stop-song-btn" class="btn hidden" style="padding: 10px 20px; background: #441a29; color: #ff4757;">■ Stop</button>
            <div id="room-code-tag" class="badge badge-waiting">ROOM: PARTY1</div>
        </div>
    </header>

    <div class="host-layout">
        <!-- Main Game Arena -->
        <main class="host-main-area">
            <!-- Scrolling / Sliding Pitch Ribbon (Rock Band / SingStar Canvas) -->
            <canvas id="pitch-ribbon" class="pitch-ribbon-canvas" width="1000" height="240"></canvas>

            <!-- Synchronized Scrolling Lyrics -->
            <div class="lyrics-container">
                <div id="current-phrase" class="current-phrase">Ready to Sing!</div>
                <div id="next-phrase" class="next-phrase">Connect your phone to join...</div>
            </div>

            <!-- Hidden Audio Backing Track -->
            <audio id="audio-player" preload="auto"></audio>
        </main>

        <!-- Sidebar: QR Code & Live Leaderboard -->
        <aside class="host-sidebar">
            <div class="qr-modal-section">
                <div style="font-weight: 700; font-size: 0.95rem; color: var(--accent-cyan);">SCAN TO JOIN STAGE</div>
                <img id="qr-code-img" class="qr-img" alt="Scan QR Code" src="/api/qr?room=PARTY1">
                <div style="font-size: 0.8rem; color: var(--text-muted);">
                    Open phone camera or go to:<br>
                    <strong id="join-url-text" style="color: white;">/player?room=PARTY1</strong>
                </div>
            </div>

            <div class="leaderboard-title">
                <span>LEADERBOARD</span>
                <span id="player-count-badge" style="font-size: 0.85rem; color: var(--text-muted);">0 singers</span>
            </div>

            <ul id="leaderboard-list" class="leaderboard-list">
                <li class="leaderboard-item" style="color: var(--text-muted); justify-content: center;">
                    Waiting for singers to join...
                </li>
            </ul>
        </aside>
    </div>

    <script src="/static/host.js"></script>
</body>
</html>
